server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:file:../config-repo/}
        git:
          uri: ${CONFIG_GIT_URI:}
          default-label: ${CONFIG_GIT_BRANCH:main}
          clone-on-start: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info
