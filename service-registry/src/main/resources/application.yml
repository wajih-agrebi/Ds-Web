server:
  port: 8761
spring:
  application:
    name: service-registry
eureka:
  server:
    response-cache-update-interval-ms: 5000
  client:
    register-with-eureka: false
    fetch-registry: false
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info
